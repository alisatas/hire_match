plugins {
    id "com.android.application"
}

// The site this app opens. Everything below follows from it.
def host = "cvxray.com"
def startUrl = "https://${host}/?source=android"

def keystoreFile = rootProject.file("keystore.properties")
def keystore = new Properties()
if (keystoreFile.exists()) keystore.load(new FileInputStream(keystoreFile))

android {
    namespace "com.cvxray.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.cvxray.app"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        manifestPlaceholders = [hostName: host, launchUrl: startUrl]
        resValue "string", "app_name", "CVXray"
        resValue "string", "launch_url", startUrl
        // Digital Asset Links statement: the site must vouch for this app (assetlinks.json)
        resValue "string", "asset_statements",
            "[{\\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], \\\"target\\\": {\\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://${host}\\\"}}]"
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore["storeFile"])
                storePassword keystore["storePassword"]
                keyAlias keystore["keyAlias"]
                keyPassword keystore["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google's TWA library: launcher activity, splash screen, fallback to a Custom Tab
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}

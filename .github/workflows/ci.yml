name: CI

# Runs on every push and pull request. The release workflow only publishes; this one
# is the gate that catches type errors, lint errors, broken builds and known-vulnerable
# production dependencies before they reach main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build, audit
    # Pinned to a known image that ships Google Chrome (used by the browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: '0'

      # Early, so it runs even when a later step fails. Fails only on high/critical
      # advisories in production packages; dev-tooling issues are tracked in agent-logs/security.md
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests (scoring engine, SSRF guard, scrubbing)
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # The runner image already includes Google Chrome; the browser tests use it directly.
      # `npx playwright install --with-deps chromium` hung for 10 minutes and failed in CI.
      - name: Check Chrome is available
        run: google-chrome --version

      # End-to-end flow + WCAG 2 AA accessibility checks against the production build
      - name: Browser tests (e2e + accessibility)
        timeout-minutes: 8
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

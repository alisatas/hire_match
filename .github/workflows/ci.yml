name: CI

# Runs on every push and pull request. The release workflow only publishes; this one
# is the gate that catches type errors, lint errors, broken builds and known-vulnerable
# production dependencies before they reach main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, build, audit
    # Pinned: ubuntu-latest moved to Ubuntu 26, whose system packages Playwright's
    # --with-deps install does not support yet. Revisit when Playwright adds it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          HUSKY: '0'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      - name: Unit tests (scoring engine, SSRF guard, scrubbing)
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # End-to-end flow + WCAG 2 AA accessibility checks against the production build
      - name: Browser tests (e2e + accessibility)
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      # Fails only on high/critical advisories in packages that ship to production;
      # moderate issues in dev tooling are tracked in agent-logs/security.md
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high
